server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_set_header Host $host;
    }

    location /webhook/ {
        proxy_pass http://backend:4000/webhook/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
