services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=flowforge
      - POSTGRES_DB=flowforge
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - flowforge_pgdata:/var/lib/postgresql/data
    ports:
      - "${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowforge -d flowforge"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - self_host_secrets:/run/iii3xnz
    environment:
      - SELF_HOSTED=true
      - DATABASE_URL=postgres://flowforge@postgres:5432/flowforge
      - PORT=4000
      - APP_URL=${APP_URL:-http://localhost:80}
      - APP_SMTP_HOST=${APP_SMTP_HOST:-}
      - APP_SMTP_PORT=${APP_SMTP_PORT:-587}
      - APP_SMTP_USER=${APP_SMTP_USER:-}
      - APP_SMTP_PASS=${APP_SMTP_PASS:-}
      - APP_SMTP_FROM=${APP_SMTP_FROM:-}
    ports:
      - "${API_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/readiness').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Separate process from the API server — this is what actually delivers
  # the "one slow workflow can't block everyone else" property. Scale by
  # running more replicas of this service; they'll safely split the queue
  # via FOR UPDATE SKIP LOCKED (see backend/src/worker.js).
  worker:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - self_host_secrets:/run/iii3xnz
    environment:
      - SELF_HOSTED=true
      - DATABASE_URL=postgres://flowforge@postgres:5432/flowforge
    command: ["node", "src/worker.js"]

  test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: backend/Dockerfile.test
    depends_on:
      - postgres
    environment:
      - DATABASE_URL=postgres://flowforge@postgres:5432/flowforge
      - JWT_SECRET=${JWT_SECRET:-open-source-test-jwt}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      - NODE_ENV=test
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-test-google-id}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-test-google-secret}
      - SLACK_OAUTH_CLIENT_ID=${SLACK_OAUTH_CLIENT_ID:-test-slack-id}
      - SLACK_OAUTH_CLIENT_SECRET=${SLACK_OAUTH_CLIENT_SECRET:-test-slack-secret}
      - GITHUB_OAUTH_CLIENT_ID=${GITHUB_OAUTH_CLIENT_ID:-test-github-id}
      - GITHUB_OAUTH_CLIENT_SECRET=${GITHUB_OAUTH_CLIENT_SECRET:-test-github-secret}
      - MICROSOFT_OAUTH_CLIENT_ID=${MICROSOFT_OAUTH_CLIENT_ID:-test-microsoft-id}
      - MICROSOFT_OAUTH_CLIENT_SECRET=${MICROSOFT_OAUTH_CLIENT_SECRET:-test-microsoft-secret}
      - HUBSPOT_OAUTH_CLIENT_ID=${HUBSPOT_OAUTH_CLIENT_ID:-test-hubspot-id}
      - HUBSPOT_OAUTH_CLIENT_SECRET=${HUBSPOT_OAUTH_CLIENT_SECRET:-test-hubspot-secret}
      - DODO_WEBHOOK_SECRET=${DODO_WEBHOOK_SECRET:-whsec_test_secret_value}
      - DODO_PRODUCT_STARTER=${DODO_PRODUCT_STARTER:-starter-product}
      - DODO_PRODUCT_PRO=${DODO_PRODUCT_PRO:-pro-product}

  frontend:
    build:
      context: ./frontend
      args:
        VITE_SELF_HOSTED: "true"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  flowforge_pgdata:
  self_host_secrets:
